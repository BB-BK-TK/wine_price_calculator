<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3eee8" />
  <title>Wine Match</title>
  <meta name="description" content="A playful Korean name-stroke compatibility game for wine and food." />
  <style>
    :root{
      --paper:#f4efe9;--paper-2:#ebe3da;--surface:#fffdf9;--ink:#211916;--muted:#7a6d67;
      --line:#ded4ca;--wine:#5b1730;--wine-deep:#35101f;--wine-soft:#f0e2e7;
      --brass:#a56e2d;--brass-soft:#f3e6d2;--green:#446754;--shadow:0 18px 50px rgba(61,34,25,.10)
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--paper)}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 100% 0%,rgba(91,23,48,.08),transparent 30%),linear-gradient(180deg,#f8f4ef 0%,var(--paper) 48%,#eee7e0 100%);padding:18px 12px 42px}
    button,select{font:inherit}.wrap{width:min(720px,100%);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .back,.share-top{min-height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(255,253,249,.78);color:var(--wine-deep);padding:0 13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(61,34,25,.04)}
    .share-top{gap:5px}.card{background:rgba(255,253,249,.94);border:1px solid rgba(101,75,64,.15);border-radius:24px;box-shadow:var(--shadow)}
    .hero{padding:27px}.brand{text-align:left;position:relative;padding-right:70px}
    .wine-icon{position:absolute;right:0;top:0;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:var(--wine);color:#f7e9d5;box-shadow:0 10px 24px rgba(91,23,48,.18);font-family:Georgia,"Times New Roman",serif;font-size:24px;font-style:italic}
    .brand h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,8vw,52px);font-weight:500;line-height:.98;margin:0 0 11px;letter-spacing:-2px;color:var(--wine-deep)}
    .brand p{margin:0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.6}.tag{display:inline-flex;margin-top:12px;border:1px solid #e4d5bf;background:var(--brass-soft);border-radius:999px;padding:7px 10px;color:var(--brass);font-size:11px;font-weight:750}
    .tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f1e8df;border:1px solid var(--line);border-radius:16px;margin:24px 0 20px}.tab{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:12px 10px;font-weight:800;cursor:pointer;transition:.18s}.tab.active{background:#fff;color:var(--wine-deep);box-shadow:0 3px 12px rgba(61,34,25,.06)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:760;margin:0 0 8px;font-size:13px;color:#4e423d}.select{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 14px;outline:none;transition:.16s}.select:focus{border-color:#b99172;box-shadow:0 0 0 3px rgba(165,110,45,.10)}.select option{background:#fff;color:var(--ink)}
    .primary{width:100%;margin-top:14px;min-height:52px;border:0;border-radius:15px;padding:0 18px;background:linear-gradient(180deg,#6b1f39 0%,#55152d 100%);color:#fff8f3;font-weight:850;cursor:pointer;box-shadow:0 12px 24px rgba(91,23,48,.16);transition:transform .14s,opacity .14s}.primary:active{transform:scale(.99)}.primary:disabled{cursor:default;opacity:.72;transform:none}
    .stage{display:none;margin-top:18px}.stage.show{display:block}.alias{display:none;margin-bottom:14px;padding:16px;border-radius:17px;background:#fbf3e8;border:1px solid #e7d3b8;text-align:center;color:#59463b}.alias.show{display:block;animation:aliasIn .34s ease-out}.alias strong{display:block;margin-top:3px;font-size:16px;color:var(--wine-deep)}.swap{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:11px}.swap .old{text-decoration:line-through;color:var(--muted)}.swap .new{font-weight:900;color:var(--brass);font-size:20px}
    .playbox{border-radius:21px;background:linear-gradient(180deg,#fffdfa 0%,#faf6f1 100%);border:1px solid var(--line);padding:19px 12px}.step{text-align:center;color:var(--muted);font-size:10.5px;font-weight:820;letter-spacing:.075em}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:13px;min-height:42px}.chip{min-width:39px;height:41px;padding:0 9px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;font-weight:820;color:var(--wine-deep);opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease}.chip.show{opacity:1;transform:none}.chip.wine{background:var(--wine-soft);border-color:#e7d3dc}.chip.food{background:#f5eee6;border-color:#e8ddd0}
    .calc{margin-top:21px;padding-top:18px;border-top:1px solid #eee5dc}.triangle{margin-top:13px;display:grid;gap:8px;overflow:hidden;min-height:34px}.row{display:flex;justify-content:center;gap:7px;opacity:0;transform:translateY(-4px);transition:opacity .2s ease,transform .2s ease}.row.show{opacity:1;transform:none}.num{min-width:33px;height:33px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--wine-deep);font-weight:790;font-variant-numeric:tabular-nums;transition:transform .13s ease,box-shadow .13s ease,background .13s ease,border-color .13s ease,opacity .13s ease}.row.is-active .num{opacity:.46}.row.is-active .num.is-current{opacity:1}.num.is-current{border-color:#c59558;background:#fff7eb;box-shadow:0 0 0 4px rgba(165,110,45,.09);transform:translateY(-1px) scale(1.045)}.num.is-born{animation:dominoBorn .22s ease-out}.num.is-flash{animation:dominoFlash .18s ease-out}
    .result{display:none;text-align:center;padding:24px 6px 3px}.result.show{display:block;animation:scoreReveal .34s ease-out}.result-label{color:var(--muted);font-size:12px}.score{font-family:Georgia,"Times New Roman",serif;font-size:68px;font-weight:600;line-height:1;margin-top:5px;letter-spacing:-3px;color:var(--wine)}.score small{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:22px;letter-spacing:0;font-weight:800}.verdict{margin-top:8px;font-size:19px;font-weight:820;color:var(--wine-deep)}.disclaimer{margin:10px auto 0;max-width:520px;color:var(--muted);font-size:11px;line-height:1.55}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.secondary,.share-result{min-height:48px;border-radius:14px;padding:0 14px;font-weight:800;cursor:pointer}.secondary{border:1px solid var(--line);background:#fff;color:var(--wine-deep)}.share-result{border:0;background:linear-gradient(180deg,#b98645 0%,#9e692a 100%);color:#fffaf3}.toast{min-height:20px;margin-top:9px;text-align:center;color:var(--brass);font-size:12px}
    .destiny{display:none}.destiny.show{display:block}.destiny-note{color:var(--muted);font-size:12px;line-height:1.55;margin:10px 0 14px}.rank{display:grid;gap:9px}.rank button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:13px 14px;cursor:pointer;transition:.15s}.rank button:hover{border-color:#cbb9aa;transform:translateY(-1px)}.medal{font-size:18px}.rank-name{font-weight:820;color:var(--wine-deep)}.rank-sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}.rank-score{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:600;color:var(--wine)}.destiny-alias{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:#fbf3e8;border:1px solid #e7d3b8;color:#795628;font-size:12px;line-height:1.5}.destiny-alias.show{display:block;animation:aliasIn .3s ease-out}
    .method{margin-top:14px;padding:19px 20px}.method h3{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:600;color:var(--wine-deep)}.method p{margin:0;color:var(--muted);font-size:11px;line-height:1.65}.footer{margin-top:13px;text-align:center;color:#9a8c84;font-size:10px;line-height:1.5}
    @keyframes aliasIn{from{opacity:0;transform:translateY(7px) scale(.99)}to{opacity:1;transform:none}}
    @keyframes dominoBorn{from{opacity:0;transform:translateY(-7px) scale(.9)}to{opacity:1;transform:none}}
    @keyframes dominoFlash{0%{box-shadow:0 0 0 0 rgba(165,110,45,0);transform:scale(.96)}55%{box-shadow:0 0 0 5px rgba(165,110,45,.10);transform:scale(1.08)}100%{box-shadow:0 0 0 0 rgba(165,110,45,0);transform:scale(1)}}
    @keyframes scoreReveal{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:560px){body{padding:12px 10px 30px}.hero{padding:23px 16px}.grid{grid-template-columns:1fr}.result-actions{grid-template-columns:1fr}.score{font-size:60px}.topbar{margin-bottom:10px}.brand{padding-right:60px}.wine-icon{width:48px;height:48px;font-size:21px}.triangle{gap:7px}.row{gap:5px}.num{min-width:30px;height:30px;font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><a class="back" href="./" id="backBtn">←</a><button class="share-top" type="button" id="shareTop">↗ <span id="shareTopLabel"></span></button></div>
    <section class="card hero">
      <div class="brand"><div class="wine-icon" aria-hidden="true">M</div><h1 id="title"></h1><p id="subtitle"></p><div class="tag" id="funTag"></div></div>
      <div class="tabs"><button id="pairTab" class="tab active" type="button"></button><button id="destinyTab" class="tab" type="button"></button></div>

      <section id="pairPanel">
        <div class="grid">
          <div class="field"><label for="grape" id="grapeLabel"></label><select id="grape" class="select"></select></div>
          <div class="field"><label for="food" id="foodLabel"></label><select id="food" class="select"></select></div>
        </div>
        <button id="runBtn" class="primary" type="button"></button>
        <div id="stage" class="stage" aria-live="polite">
          <div id="aliasBox" class="alias"><div id="aliasLine"></div><strong id="aliasStrong"></strong><div class="swap"><span id="aliasOld" class="old"></span><span>→</span><span id="aliasNew" class="new"></span></div></div>
          <div class="playbox">
            <div class="step" id="mixStep"></div><div id="letters" class="letters"></div>
            <div class="calc"><div class="step" id="calcStep"></div><div id="triangle" class="triangle"></div></div>
            <div id="result" class="result"><div class="result-label" id="resultLabel"></div><div id="score" class="score"></div><div id="verdict" class="verdict"></div><div id="disclaimer" class="disclaimer"></div><div class="result-actions"><button id="againBtn" class="secondary" type="button"></button><button id="shareResult" class="share-result" type="button"></button></div><div id="toast" class="toast"></div></div>
          </div>
        </div>
      </section>

      <section id="destinyPanel" class="destiny">
        <div class="field"><label for="destinyGrape" id="destinyGrapeLabel"></label><select id="destinyGrape" class="select"></select></div>
        <p class="destiny-note" id="destinyNote"></p><div id="rank" class="rank"></div><div id="destinyAlias" class="destiny-alias"></div>
      </section>
    </section>
    <section class="card method"><h3 id="methodTitle"></h3><p id="methodCopy"></p></section>
    <div class="footer" id="footer"></div>
  </main>
<script>
(() => {
  const lang=(navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en';
  document.documentElement.lang=lang;
  const T={
    ko:{title:'와인 궁합',subtitle:'포도 품종과 메뉴 이름을 옛날 이름궁합처럼 섞어봐요.',tag:'실제 페어링 점수 아님 · 이름 획수 놀이',pair:'궁합 보기',destiny:'운명 찾기',grape:'포도 품종',food:'메뉴',run:'궁합 보기',working:'운명 계산 중…',aliasLine:'이름이 조금 길어서,',aliasStrong:'이번엔 줄임말로 가볼게요!',mix:'STEP 1 · 두 이름을 골고루 섞는 중',calc:'STEP 2 · 획수로 바꾸고, 옆 숫자끼리 계속 더하기',result:'마지막 두 숫자를 붙이면…',again:'다른 궁합 보기',share:'결과 공유하기',shareTop:'공유',copied:'링크를 복사했어요',shareText:'이 와인 궁합 결과 봐봐 🍷💘',destinyGrape:'운명을 찾을 품종',destinyNote:'메뉴들과 전부 이름궁합을 계산해서 TOP 5를 찾아요.',aliasDestiny:(a,b)=>`${a}는 운명 찾기에서도 줄임말 ${b}로 계산해요.`,methodTitle:'어떻게 계산해요?',methodCopy:'한국식 이름궁합 놀이처럼 한글 획수를 숫자로 바꾸고, 두 이름을 골고루 섞은 뒤 옆 숫자를 더해 마지막 두 자리까지 줄입니다. 점수에는 실제 와인 페어링 지식이 들어가지 않아요.',footer:'Wine Price Calculator · Fun Lab',verdict:s=>s>=90?'거의 운명인데요? 💘':s>=75?'꽤 잘 맞는 사이예요 ❤️':s>=55?'은근히 가능성 있어요 🙂':s>=30?'친구로는 괜찮을지도 😌':'각자의 길을 추천합니다 💔',rankSub:s=>s>=90?'운명 후보':s>=75?'아주 좋은 궁합':s>=55?'은근히 잘 맞음':'의외의 조합',back:'가격 계산기로 돌아가기'},
    en:{title:'Wine Match',subtitle:'Mix a grape variety and a menu name like an old-school Korean name compatibility game.',tag:'Just for fun · not a real pairing score',pair:'Compatibility',destiny:'Find my destiny',grape:'Grape variety',food:'Menu',run:'Reveal compatibility',working:'Calculating…',aliasLine:'That name is a little long,',aliasStrong:"so we'll use a shorthand this time!",mix:'STEP 1 · Evenly mixing the two names',calc:'STEP 2 · Turn letters into stroke counts, then keep adding neighbors',result:'When the final two digits remain…',again:'Try another match',share:'Share result',shareTop:'Share',copied:'Link copied',shareText:'Check out this wine match result 🍷💘',destinyGrape:'Grape to match',destinyNote:'We run the name game against every menu and show the top 5.',aliasDestiny:(a,b)=>`${a} uses the shorthand ${b} for this Korean stroke-count game.`,methodTitle:'How is it calculated?',methodCopy:'This is based on a Korean name-compatibility game. We convert Hangul letters into stroke counts, distribute both names evenly, then repeatedly add neighboring digits until two remain. Real wine pairing knowledge is not part of the score.',footer:'Wine Price Calculator · Fun Lab',verdict:s=>s>=90?'Almost destiny 💘':s>=75?'A very good match ❤️':s>=55?'There might be something here 🙂':s>=30?'Maybe better as friends 😌':'Probably separate paths 💔',rankSub:s=>s>=90?'Destiny contender':s>=75?'Very strong match':s>=55?'Surprisingly good':'Unexpected pairing',back:'Back to price calculator'}
  }[lang];

  const grapes=[
    {id:'sauvignon-blanc',ko:'소비뇽블랑',en:'Sauvignon Blanc',calc:'소비뇽블랑'},
    {id:'chardonnay',ko:'샤르도네',en:'Chardonnay',calc:'샤르도네'},
    {id:'pinot-noir',ko:'피노누아',en:'Pinot Noir',calc:'피노누아'},
    {id:'cabernet-sauvignon',ko:'카베르네소비뇽',en:'Cabernet Sauvignon',calc:'카베르네소비뇽',alias:'까쇼'},
    {id:'riesling',ko:'리슬링',en:'Riesling',calc:'리슬링'},
    {id:'malbec',ko:'말벡',en:'Malbec',calc:'말벡'},
    {id:'merlot',ko:'메를로',en:'Merlot',calc:'메를로'},
    {id:'syrah',ko:'시라',en:'Syrah',calc:'시라'},
    {id:'zinfandel',ko:'진판델',en:'Zinfandel',calc:'진판델'},
    {id:'moscato',ko:'모스카토',en:'Moscato',calc:'모스카토'}
  ];
  const foods=[
    {id:'grilled-fish',ko:'생선구이',en:'Grilled fish',calc:'생선구이'},
    {id:'samgyeopsal',ko:'삼겹살',en:'Samgyeopsal',calc:'삼겹살'},
    {id:'fried-chicken',ko:'치킨',en:'Fried chicken',calc:'치킨'},
    {id:'pizza',ko:'피자',en:'Pizza',calc:'피자'},
    {id:'sashimi',ko:'생선회',en:'Sashimi',calc:'생선회'},
    {id:'steak',ko:'스테이크',en:'Steak',calc:'스테이크'},
    {id:'tteokbokki',ko:'떡볶이',en:'Tteokbokki',calc:'떡볶이'},
    {id:'pasta',ko:'파스타',en:'Pasta',calc:'파스타'},
    {id:'kimchi-jjigae',ko:'김치찌개',en:'Kimchi jjigae',calc:'김치찌개'},
    {id:'sushi',ko:'초밥',en:'Sushi',calc:'초밥'},
    {id:'cheese',ko:'치즈',en:'Cheese',calc:'치즈'},
    {id:'lamb-chops',ko:'양갈비',en:'Lamb chops',calc:'양갈비'}
  ];

  const initials=[2,4,2,3,6,5,4,4,8,2,4,1,3,6,4,3,4,4,3];
  const vowels=[2,3,3,4,2,3,3,4,2,4,5,3,3,2,4,5,3,3,1,2,1];
  const finals=[0,2,4,4,2,5,5,3,5,7,9,9,7,9,9,8,4,4,6,2,4,1,3,4,3,4,4,3];
  function strokes(ch){const code=ch.codePointAt(0);if(code<0xAC00||code>0xD7A3)return 0;const n=code-0xAC00;const i=Math.floor(n/588),v=Math.floor((n%588)/28),f=n%28;return initials[i]+vowels[v]+finals[f];}
  function balancedMerge(a,b){const A=[...a].map((ch,i)=>({ch,side:'wine',p:(i+.5)/a.length}));const B=[...b].map((ch,i)=>({ch,side:'food',p:(i+.5)/b.length}));return A.concat(B).sort((x,y)=>x.p-y.p||(x.side==='food'?-1:1));}
  function rowsFor(items){const rows=[items.map(x=>strokes(x.ch))];while(rows[rows.length-1].length>2){const prev=rows[rows.length-1],next=[];for(let i=0;i<prev.length-1;i++)next.push((prev[i]+prev[i+1])%10);rows.push(next);}return rows;}
  function compute(g,f){const calcName=g.alias||g.calc;const items=balancedMerge(calcName,f.calc);const rows=rowsFor(items);const last=rows[rows.length-1];return {items,rows,score:(last[0]||0)*10+(last[1]||0),calcName};}

  const $=id=>document.getElementById(id);let runId=0;
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function label(x){return x[lang];}
  function populate(select,data){select.innerHTML=data.map(x=>`<option value="${x.id}">${label(x)}</option>`).join('');}
  function grapeById(id){return grapes.find(x=>x.id===id)||grapes[0]}function foodById(id){return foods.find(x=>x.id===id)||foods[0]}
  function setText(){document.title=T.title+' · Wine Price Calculator';$('title').textContent=T.title;$('subtitle').textContent=T.subtitle;$('funTag').textContent=T.tag;$('pairTab').textContent=T.pair;$('destinyTab').textContent=T.destiny;$('grapeLabel').textContent=T.grape;$('foodLabel').textContent=T.food;$('runBtn').textContent=T.run;$('aliasLine').textContent=T.aliasLine;$('aliasStrong').textContent=T.aliasStrong;$('mixStep').textContent=T.mix;$('calcStep').textContent=T.calc;$('resultLabel').textContent=T.result;$('againBtn').textContent=T.again;$('shareResult').textContent=T.share;$('shareTopLabel').textContent=T.shareTop;$('destinyGrapeLabel').textContent=T.destinyGrape;$('destinyNote').textContent=T.destinyNote;$('methodTitle').textContent=T.methodTitle;$('methodCopy').textContent=T.methodCopy;$('footer').textContent=T.footer;$('backBtn').setAttribute('aria-label',T.back);}
  function setWorking(working){$('runBtn').disabled=working;$('runBtn').textContent=working?T.working:T.run;$('stage').setAttribute('aria-busy',working?'true':'false');}
  function clearStage(){runId++;$('stage').classList.remove('show');$('aliasBox').classList.remove('show');$('letters').innerHTML='';$('triangle').innerHTML='';$('result').classList.remove('show');$('toast').textContent='';setWorking(false);}
  function showResult(r){$('score').innerHTML=`${String(r.score).padStart(2,'0')}<small>%</small>`;$('verdict').textContent=T.verdict(r.score);$('disclaimer').textContent=lang==='ko'?'점수는 100% 이름 획수 놀이예요. 산도, 바디, 실제 음식 궁합은 반영하지 않았습니다.':'100% name-stroke game. Acidity, body and real food pairing are not used.';$('result').classList.add('show');}
  function makeRow(values,hidden=false){const row=document.createElement('div');row.className='row show';values.forEach(v=>{const n=document.createElement('span');n.className='num';n.textContent=hidden?'':v;if(hidden)n.style.opacity='0';row.appendChild(n);});return row;}
  async function revealLetters(items,myRun){const letters=$('letters');letters.innerHTML=items.map(x=>`<span class="chip ${x.side}">${x.ch}</span>`).join('');const chips=[...letters.querySelectorAll('.chip')];if(reduceMotion()){chips.forEach(x=>x.classList.add('show'));return;}for(const chip of chips){if(myRun!==runId)return;chip.classList.add('show');await sleep(34);}}
  async function runDomino(rows,myRun){const triangle=$('triangle');triangle.innerHTML='';const first=makeRow(rows[0]);triangle.appendChild(first);if(!reduceMotion())await sleep(120);
    for(let ri=0;ri<rows.length-1;ri++){
      if(myRun!==runId)return;
      const current=triangle.children[ri],currentNums=[...current.querySelectorAll('.num')],nextValues=rows[ri+1],next=makeRow(nextValues,true);triangle.appendChild(next);const nextNums=[...next.querySelectorAll('.num')];current.classList.add('is-active');
      for(let i=0;i<nextValues.length;i++){
        if(myRun!==runId)return;
        currentNums[i].classList.add('is-current');currentNums[i+1].classList.add('is-current');
        if(!reduceMotion())await sleep(36);
        nextNums[i].textContent=nextValues[i];nextNums[i].style.opacity='1';nextNums[i].classList.add('is-born','is-flash');
        if(!reduceMotion())await sleep(24);
        currentNums[i].classList.remove('is-current');currentNums[i+1].classList.remove('is-current');
      }
      current.classList.remove('is-active');if(!reduceMotion())await sleep(72);
    }
  }
  async function renderCalc(g,f,instant=false){
    clearStage();const myRun=runId;const r=compute(g,f);$('stage').classList.add('show');setWorking(!instant);
    if(g.alias){$('aliasOld').textContent=label(g);$('aliasNew').textContent=g.alias;$('aliasBox').classList.add('show');if(!instant&&!reduceMotion())await sleep(390);}
    if(myRun!==runId)return;
    if(instant){$('letters').innerHTML=r.items.map(x=>`<span class="chip ${x.side} show">${x.ch}</span>`).join('');$('triangle').innerHTML=r.rows.map(row=>`<div class="row show">${row.map(n=>`<span class="num">${n}</span>`).join('')}</div>`).join('');showResult(r);setWorking(false);return;}
    await revealLetters(r.items,myRun);if(myRun!==runId)return;if(!reduceMotion())await sleep(110);await runDomino(r.rows,myRun);if(myRun!==runId)return;if(!reduceMotion())await sleep(150);showResult(r);setWorking(false);
  }
  function setMode(mode){const pair=mode==='pair';$('pairPanel').style.display=pair?'block':'none';$('destinyPanel').classList.toggle('show',!pair);$('pairTab').classList.toggle('active',pair);$('destinyTab').classList.toggle('active',!pair);if(!pair){clearStage();renderDestiny();}}
  function renderDestiny(){const g=grapeById($('destinyGrape').value);const ranked=foods.map(f=>({f,...compute(g,f)})).sort((a,b)=>b.score-a.score).slice(0,5);$('rank').innerHTML=ranked.map((x,i)=>`<button type="button" data-food="${x.f.id}"><span class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><span><span class="rank-name">${label(x.f)}</span><span class="rank-sub">${T.rankSub(x.score)}</span></span><span class="rank-score">${String(x.score).padStart(2,'0')}%</span></button>`).join('');$('destinyAlias').classList.toggle('show',!!g.alias);$('destinyAlias').textContent=g.alias?T.aliasDestiny(label(g),g.alias):'';$('rank').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{$('grape').value=g.id;$('food').value=b.dataset.food;setMode('pair');renderCalc(g,foodById(b.dataset.food),false);history.replaceState(null,'',shareUrl(g.id,b.dataset.food));}));}
  function shareUrl(gid,fid){const u=new URL(location.href);u.search='';u.searchParams.set('grape',gid);u.searchParams.set('food',fid);u.searchParams.set('result','1');return u.toString();}
  async function shareCurrent(){const g=grapeById($('grape').value),f=foodById($('food').value),url=shareUrl(g.id,f.id);try{if(navigator.share){await navigator.share({title:T.title,text:T.shareText,url});}else if(navigator.clipboard){await navigator.clipboard.writeText(url);$('toast').textContent=T.copied;}else{prompt(T.share,url);}}catch(e){if(e&&e.name!=='AbortError')$('toast').textContent=url;}}
  function loadParams(){const p=new URLSearchParams(location.search),gid=p.get('grape'),fid=p.get('food');if(gid&&grapes.some(x=>x.id===gid)){$('grape').value=gid;$('destinyGrape').value=gid}if(fid&&foods.some(x=>x.id===fid))$('food').value=fid;if(p.get('result')==='1'&&gid&&fid)renderCalc(grapeById(gid),foodById(fid),true);}

  populate($('grape'),grapes);populate($('destinyGrape'),grapes);populate($('food'),foods);setText();loadParams();
  $('runBtn').addEventListener('click',()=>{const g=grapeById($('grape').value),f=foodById($('food').value);renderCalc(g,f,false);history.replaceState(null,'',shareUrl(g.id,f.id));});
  $('pairTab').addEventListener('click',()=>setMode('pair'));$('destinyTab').addEventListener('click',()=>setMode('destiny'));$('destinyGrape').addEventListener('change',renderDestiny);$('againBtn').addEventListener('click',()=>{clearStage();history.replaceState(null,'',location.pathname);});$('shareResult').addEventListener('click',shareCurrent);$('shareTop').addEventListener('click',shareCurrent);
})();
</script>
</body>
