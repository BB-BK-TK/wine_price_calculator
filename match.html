<!DOCTYPE html>
<html lang="ko">
<head>

  <title>Wine Match</title>
  <meta name="description" content="A playful Korean name-stroke compatibility game for wine and food." />
  <style>
    :root{--paper:#f5f1eb;--surface:#fffdf9;--ink:#211d1a;--muted:#766c65;--line:#d9d0c8;--wine:#641b38;--wine-deep:#37101f;--wine-soft:#eadde1;--brass:#9d6a2e;--brass-soft:#f2e7d7}
    *{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{margin:0;min-height:100vh;padding:0 16px 112px;color:var(--ink);background:linear-gradient(180deg,#faf7f2 0,#f5f1eb 280px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit}.wrap{width:min(680px,100%);margin:auto}.card{border:0;border-radius:0;background:transparent;box-shadow:none}
    .topbar{display:flex;height:58px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.back,.share-top{display:inline-flex;min-height:40px;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:var(--wine);font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}.share-top{gap:4px}.hero{padding:0}.brand{position:relative;padding:24px 0 20px}.brand:before{content:'FUN LAB';display:block;margin-bottom:8px;color:var(--wine);font-size:10px;font-weight:850;letter-spacing:.18em}.wine-icon{display:none}.brand h1{margin:0 0 8px;color:var(--wine-deep);font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-1.2px}.brand p{max-width:560px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.tag{display:inline-flex;margin-top:10px;padding:0;color:var(--brass);font-size:10px;font-weight:750}
    .tabs{display:flex;gap:24px;margin:0 0 22px;border-bottom:1px solid var(--line)}.tab{position:relative;padding:12px 0;border:0;background:transparent;color:#8b817a;font-size:12px;font-weight:850;cursor:pointer}.tab.active{color:var(--wine-deep)}.tab.active:after{content:'';position:absolute;right:0;bottom:-1px;left:0;height:2px;background:var(--wine)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;margin:0 0 7px;color:#504741;font-size:11.5px;font-weight:800}.select{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:rgba(255,253,249,.7);color:var(--ink);transition:border-color .15s,background .15s}.select:focus{border-color:var(--wine);background:var(--surface)}.select option{background:#fff;color:var(--ink)}.primary{width:100%;min-height:52px;margin-top:14px;padding:0 18px;border:1px solid var(--wine);border-radius:10px;background:var(--wine);color:#fff;font-weight:850;cursor:pointer;transition:transform .14s,opacity .14s}.primary:active{transform:scale(.99)}.primary:disabled{opacity:.48;cursor:default;transform:none}
    .stage{display:none;margin-top:26px}.stage.show{display:block}.alias{display:none;margin-bottom:20px;padding:12px 0 12px 14px;border-left:2px solid var(--brass);color:#59463b}.alias.show{display:block;animation:aliasIn .34s ease-out}.alias strong{display:block;margin-top:3px;color:var(--wine-deep);font-size:16px}.swap{display:flex;align-items:center;gap:10px;margin-top:9px}.swap .old{color:var(--muted);text-decoration:line-through}.swap .new{color:var(--brass);font-size:20px;font-weight:900}
    .playbox{padding:24px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent}.step{text-align:center;color:var(--muted);font-size:9.5px;font-weight:820;letter-spacing:.08em}.letters{display:flex;min-height:40px;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}.chip{display:inline-flex;min-width:38px;height:40px;align-items:center;justify-content:center;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--wine-deep);font-weight:820;opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease}.chip.show{opacity:1;transform:none}.chip.wine{border-color:#d7bbc5;background:var(--wine-soft)}.chip.food{background:#eee6dc}.calc{margin-top:22px;padding-top:19px;border-top:1px solid var(--line)}.triangle{display:grid;min-height:32px;margin-top:14px;gap:7px;overflow:hidden}.row{display:flex;justify-content:center;gap:6px;opacity:0;transform:translateY(-4px);transition:opacity .2s ease,transform .2s ease}.row.show{opacity:1;transform:none}.num{display:inline-flex;min-width:31px;height:31px;align-items:center;justify-content:center;padding:0 6px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--wine-deep);font-size:13px;font-weight:790;font-variant-numeric:tabular-nums;transition:transform .13s ease,box-shadow .13s ease,background .13s ease,border-color .13s ease,opacity .13s ease}.row.is-active .num{opacity:.35}.row.is-active .num.is-current{opacity:1}.num.is-current{border-color:var(--brass);background:#fff8ed;box-shadow:0 0 0 3px rgba(157,106,46,.08);transform:translateY(-1px) scale(1.045)}.num.is-born{animation:dominoBorn .22s ease-out}.num.is-flash{animation:dominoFlash .18s ease-out}
    .result{display:none;padding:28px 0 4px;text-align:center}.result.show{display:block;animation:scoreReveal .34s ease-out}.result-label{color:var(--muted);font-size:11px}.score{margin-top:5px;color:var(--wine);font-family:Georgia,"Times New Roman",serif;font-size:72px;font-weight:600;line-height:1;letter-spacing:-3px}.score small{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:20px;font-weight:800;letter-spacing:0}.verdict{margin-top:8px;color:var(--wine-deep);font-size:18px;font-weight:820}.disclaimer{max-width:520px;margin:10px auto 0;color:var(--muted);font-size:10.5px;line-height:1.55}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.secondary,.share-result{min-height:48px;padding:0 14px;border-radius:10px;font-weight:800;cursor:pointer}.secondary{border:1px solid var(--line);background:transparent;color:var(--wine-deep)}.share-result{border:1px solid var(--brass);background:var(--brass);color:#fff}.toast{min-height:20px;margin-top:9px;color:var(--brass);font-size:12px;text-align:center}
    .destiny{display:none}.destiny.show{display:block}.destiny-note{margin:10px 0 18px;color:var(--muted);font-size:11.5px;line-height:1.55}.rank{border-top:1px solid var(--line)}.rank button{display:grid;width:100%;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:15px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.medal{color:var(--brass);font-family:Georgia,"Times New Roman",serif;font-size:16px}.rank-name{color:var(--wine-deep);font-weight:820}.rank-sub{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}.rank-score{color:var(--wine);font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:600}.destiny-alias{display:none;margin-top:14px;padding:12px 0 12px 14px;border-left:2px solid var(--brass);color:#795628;font-size:11.5px;line-height:1.5}.destiny-alias.show{display:block;animation:aliasIn .3s ease-out}
    .method{margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.method summary{padding:16px 0;color:#564b45;font-size:11px;font-weight:800;cursor:pointer;list-style:none}.method summary::-webkit-details-marker{display:none}.method summary:after{content:'+';float:right;color:var(--wine);font-size:16px;font-weight:500}.method[open] summary:after{content:'–'}.method p{margin:0;padding:0 0 17px;color:var(--muted);font-size:10.5px;line-height:1.65}.footer{margin-top:16px;color:#9a8c84;font-size:9.5px;line-height:1.5;text-align:center}
    .bottom-nav{position:fixed;z-index:40;right:0;bottom:0;left:0;display:grid;width:min(680px,100%);height:70px;grid-template-columns:1fr 1fr;margin:auto;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(120,104,94,.2);background:rgba(255,253,249,.94);backdrop-filter:blur(18px)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8b817a;font-size:10px;font-weight:750;text-decoration:none}.bottom-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}.bottom-nav a.active{color:var(--wine)}
    @keyframes aliasIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes dominoBorn{from{opacity:0;transform:translateY(-7px) scale(.9)}to{opacity:1;transform:none}}@keyframes dominoFlash{0%{box-shadow:0 0 0 0 rgba(157,106,46,0);transform:scale(.96)}55%{box-shadow:0 0 0 4px rgba(157,106,46,.09);transform:scale(1.08)}100%{box-shadow:0 0 0 0 rgba(157,106,46,0);transform:scale(1)}}@keyframes scoreReveal{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
    @media(min-width:720px){body{padding-top:24px}.wrap{padding:0 24px 60px;background:rgba(255,253,249,.38)}.bottom-nav{border-right:1px solid rgba(120,104,94,.16);border-left:1px solid rgba(120,104,94,.16)}}
    @media(max-width:560px){body{padding-right:18px;padding-left:18px}.brand h1{font-size:29px}.grid{grid-template-columns:1fr}.primary{position:sticky;z-index:20;bottom:78px;box-shadow:0 0 0 8px rgba(245,241,235,.94)}#pairPanel:has(.stage.show) .primary{position:static;box-shadow:none}.playbox{margin-right:-2px;margin-left:-2px}.result-actions{grid-template-columns:1fr}.score{font-size:64px}.triangle{gap:6px}.row{gap:4px}.num{min-width:28px;height:28px;padding:0 5px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>

<body>
  <main class="wrap">
    <div class="topbar"><a class="back" href="./" id="backBtn">← Price</a><button class="share-top" type="button" id="shareTop">↗ <span id="shareTopLabel"></span></button></div>
    <section class="card hero">
      <div class="brand"><div class="wine-icon" aria-hidden="true">M</div><h1 id="title"></h1><p id="subtitle"></p><div class="tag" id="funTag"></div></div>
      <div class="tabs"><button id="pairTab" class="tab active" type="button"></button><button id="destinyTab" class="tab" type="button"></button></div>

      <section id="pairPanel">
        <div class="grid">
          <div class="field"><label for="grape" id="grapeLabel"></label><select id="grape" class="select"></select></div>
          <div class="field"><label for="food" id="foodLabel"></label><select id="food" class="select"></select></div>
        </div>
        <button id="runBtn" class="primary" type="button"></button>
        <div id="stage" class="stage" aria-live="polite">
          <div id="aliasBox" class="alias"><div id="aliasLine"></div><strong id="aliasStrong"></strong><div class="swap"><span id="aliasOld" class="old"></span><span>→</span><span id="aliasNew" class="new"></span></div></div>
          <div class="playbox">
            <div class="step" id="mixStep"></div><div id="letters" class="letters"></div>
            <div class="calc"><div class="step" id="calcStep"></div><div id="triangle" class="triangle"></div></div>
            <div id="result" class="result"><div class="result-label" id="resultLabel"></div><div id="score" class="score"></div><div id="verdict" class="verdict"></div><div id="disclaimer" class="disclaimer"></div><div class="result-actions"><button id="againBtn" class="secondary" type="button"></button><button id="shareResult" class="share-result" type="button"></button></div><div id="toast" class="toast"></div></div>
          </div>
        </div>
      </section>

      <section id="destinyPanel" class="destiny">
        <div class="field"><label for="destinyGrape" id="destinyGrapeLabel"></label><select id="destinyGrape" class="select"></select></div>
        <p class="destiny-note" id="destinyNote"></p><div id="rank" class="rank"></div><div id="destinyAlias" class="destiny-alias"></div>
      </section>
    </section>
    <details class="method"><summary id="methodTitle"></summary><p id="methodCopy"></p></details>
    <div class="footer" id="footer"></div>
  </main>
  <nav class="bottom-nav" aria-label="Primary navigation">
    <a href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h5M8 16h8"/></svg><span id="navPrice">Price</span></a>
    <a class="active" href="match.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.2-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.8-7 10-7 10Z"/></svg><span id="navMatch">Match</span></a>
  </nav>
<script>
(() => {
  const lang=(navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en';
  document.documentElement.lang=lang;
  const T={
    ko:{title:'와인 궁합',subtitle:'포도 품종과 메뉴 이름을 옛날 이름궁합처럼 섞어봐요.',tag:'실제 페어링 점수 아님 · 이름 획수 놀이',pair:'궁합 보기',destiny:'운명 찾기',grape:'포도 품종',food:'메뉴',grapePlaceholder:'품종을 선택하세요',foodPlaceholder:'메뉴를 선택하세요',destinyPlaceholder:'품종을 선택하세요',run:'궁합 보기',working:'운명 계산 중…',aliasLine:'이름이 조금 길어서,',aliasStrong:'이번엔 줄임말로 가볼게요!',mix:'STEP 1 · 두 이름을 골고루 섞는 중',calc:'STEP 2 · 획수로 바꾸고, 옆 숫자끼리 계속 더하기',result:'마지막 두 숫자를 붙이면…',again:'다른 궁합 보기',share:'결과 공유하기',shareTop:'공유',copied:'링크를 복사했어요',shareText:'이 와인 궁합 결과 봐봐 🍷💘',destinyGrape:'운명을 찾을 품종',destinyNote:'메뉴들과 전부 이름궁합을 계산해서 TOP 5를 찾아요.',aliasDestiny:(a,b)=>`${a}는 운명 찾기에서도 줄임말 ${b}로 계산해요.`,methodTitle:'어떻게 계산해요?',methodCopy:'한국식 이름궁합 놀이처럼 한글 획수를 숫자로 바꾸고, 두 이름을 골고루 섞은 뒤 옆 숫자를 더해 마지막 두 자리까지 줄입니다. 점수에는 실제 와인 페어링 지식이 들어가지 않아요.',footer:'Wine Price Calculator · Fun Lab',verdict:s=>s>=90?'거의 운명인데요':s>=75?'꽤 잘 맞는 사이예요':s>=55?'은근히 가능성 있어요':s>=30?'친구로는 괜찮을지도':'각자의 길을 추천합니다',rankSub:s=>s>=90?'운명 후보':s>=75?'아주 좋은 궁합':s>=55?'은근히 잘 맞음':'의외의 조합',back:'가격 계산기로 돌아가기'},
    en:{title:'Wine Match',subtitle:'Mix a grape variety and a menu name like an old-school Korean name compatibility game.',tag:'Just for fun · not a real pairing score',pair:'Compatibility',destiny:'Find my destiny',grape:'Grape variety',food:'Menu',grapePlaceholder:'Choose a grape',foodPlaceholder:'Choose a menu',destinyPlaceholder:'Choose a grape',run:'Reveal compatibility',working:'Calculating…',aliasLine:'That name is a little long,',aliasStrong:"so we'll use a shorthand this time!",mix:'STEP 1 · Evenly mixing the two names',calc:'STEP 2 · Turn letters into stroke counts, then keep adding neighbors',result:'When the final two digits remain…',again:'Try another match',share:'Share result',shareTop:'Share',copied:'Link copied',shareText:'Check out this wine match result 🍷💘',destinyGrape:'Grape to match',destinyNote:'We run the name game against every menu and show the top 5.',aliasDestiny:(a,b)=>`${a} uses the shorthand ${b} for this Korean stroke-count game.`,methodTitle:'How is it calculated?',methodCopy:'This is based on a Korean name-compatibility game. We convert Hangul letters into stroke counts, distribute both names evenly, then repeatedly add neighboring digits until two remain. Real wine pairing knowledge is not part of the score.',footer:'Wine Price Calculator · Fun Lab',verdict:s=>s>=90?'Almost destiny':s>=75?'A very good match':s>=55?'There might be something here':s>=30?'Maybe better as friends':'Probably separate paths',rankSub:s=>s>=90?'Destiny contender':s>=75?'Very strong match':s>=55?'Surprisingly good':'Unexpected pairing',back:'Back to price calculator'}
  }[lang];

  const grapes=[
    {id:'sauvignon-blanc',ko:'소비뇽블랑',en:'Sauvignon Blanc',calc:'소비뇽블랑'},
    {id:'chardonnay',ko:'샤르도네',en:'Chardonnay',calc:'샤르도네'},
    {id:'pinot-noir',ko:'피노누아',en:'Pinot Noir',calc:'피노누아'},
    {id:'cabernet-sauvignon',ko:'카베르네소비뇽',en:'Cabernet Sauvignon',calc:'카베르네소비뇽',alias:'까쇼'},
    {id:'riesling',ko:'리슬링',en:'Riesling',calc:'리슬링'},
    {id:'malbec',ko:'말벡',en:'Malbec',calc:'말벡'},
    {id:'merlot',ko:'메를로',en:'Merlot',calc:'메를로'},
    {id:'syrah',ko:'시라',en:'Syrah',calc:'시라'},
    {id:'zinfandel',ko:'진판델',en:'Zinfandel',calc:'진판델'},
    {id:'moscato',ko:'모스카토',en:'Moscato',calc:'모스카토'}
  ];
  const foods=[
    {id:'grilled-fish',ko:'생선구이',en:'Grilled fish',calc:'생선구이'},
    {id:'samgyeopsal',ko:'삼겹살',en:'Samgyeopsal',calc:'삼겹살'},
    {id:'fried-chicken',ko:'치킨',en:'Fried chicken',calc:'치킨'},
    {id:'pizza',ko:'피자',en:'Pizza',calc:'피자'},
    {id:'sashimi',ko:'생선회',en:'Sashimi',calc:'생선회'},
    {id:'steak',ko:'스테이크',en:'Steak',calc:'스테이크'},
    {id:'tteokbokki',ko:'떡볶이',en:'Tteokbokki',calc:'떡볶이'},
    {id:'pasta',ko:'파스타',en:'Pasta',calc:'파스타'},
    {id:'kimchi-jjigae',ko:'김치찌개',en:'Kimchi jjigae',calc:'김치찌개'},
    {id:'sushi',ko:'초밥',en:'Sushi',calc:'초밥'},
    {id:'cheese',ko:'치즈',en:'Cheese',calc:'치즈'},
    {id:'lamb-chops',ko:'양갈비',en:'Lamb chops',calc:'양갈비'}
  ];

  const initials=[2,4,2,3,6,5,4,4,8,2,4,1,3,6,4,3,4,4,3];
  const vowels=[2,3,3,4,2,3,3,4,2,4,5,3,3,2,4,5,3,3,1,2,1];
  const finals=[0,2,4,4,2,5,5,3,5,7,9,9,7,9,9,8,4,4,6,2,4,1,3,4,3,4,4,3];
  function strokes(ch){const code=ch.codePointAt(0);if(code<0xAC00||code>0xD7A3)return 0;const n=code-0xAC00;const i=Math.floor(n/588),v=Math.floor((n%588)/28),f=n%28;return initials[i]+vowels[v]+finals[f];}
  function balancedMerge(a,b){const A=[...a].map((ch,i)=>({ch,side:'wine',p:(i+.5)/a.length}));const B=[...b].map((ch,i)=>({ch,side:'food',p:(i+.5)/b.length}));return A.concat(B).sort((x,y)=>x.p-y.p||(x.side==='food'?-1:1));}
  function rowsFor(items){const rows=[items.map(x=>strokes(x.ch))];while(rows[rows.length-1].length>2){const prev=rows[rows.length-1],next=[];for(let i=0;i<prev.length-1;i++)next.push((prev[i]+prev[i+1])%10);rows.push(next);}return rows;}
  function compute(g,f){const calcName=g.alias||g.calc;const items=balancedMerge(calcName,f.calc);const rows=rowsFor(items);const last=rows[rows.length-1];return {items,rows,score:(last[0]||0)*10+(last[1]||0),calcName};}

  const $=id=>document.getElementById(id);let runId=0;
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function label(x){return x[lang];}
  function populate(select,data,placeholder){select.innerHTML=`<option value="" selected disabled>${placeholder}</option>`+data.map(x=>`<option value="${x.id}">${label(x)}</option>`).join('');}
  function grapeById(id){return grapes.find(x=>x.id===id)||null}function foodById(id){return foods.find(x=>x.id===id)||null}
  function selectedPair(){return {g:grapeById($('grape').value),f:foodById($('food').value)}}
  function updateReadyState(){const {g,f}=selectedPair();const ready=!!(g&&f);$('runBtn').disabled=!ready;$('shareTop').disabled=!ready;$('shareTop').style.opacity=ready?'1':'.45';return ready;}
  function setText(){document.title=T.title+' · Wine Price Calculator';$('title').textContent=T.title;$('subtitle').textContent=T.subtitle;$('funTag').textContent=T.tag;$('pairTab').textContent=T.pair;$('destinyTab').textContent=T.destiny;$('grapeLabel').textContent=T.grape;$('foodLabel').textContent=T.food;$('runBtn').textContent=T.run;$('aliasLine').textContent=T.aliasLine;$('aliasStrong').textContent=T.aliasStrong;$('mixStep').textContent=T.mix;$('calcStep').textContent=T.calc;$('resultLabel').textContent=T.result;$('againBtn').textContent=T.again;$('shareResult').textContent=T.share;$('shareTopLabel').textContent=T.shareTop;$('destinyGrapeLabel').textContent=T.destinyGrape;$('destinyNote').textContent=T.destinyNote;$('methodTitle').textContent=T.methodTitle;$('methodCopy').textContent=T.methodCopy;$('footer').textContent=T.footer;$('backBtn').setAttribute('aria-label',T.back);$('backBtn').textContent=lang==='ko'?'← 가격':'← Price';$('navPrice').textContent=lang==='ko'?'가격':'Price';$('navMatch').textContent=lang==='ko'?'궁합':'Match';}
  function setWorking(working){$('runBtn').disabled=working||!selectedPair().g||!selectedPair().f;$('runBtn').textContent=working?T.working:T.run;$('stage').setAttribute('aria-busy',working?'true':'false');}
  function clearStage(){runId++;$('stage').classList.remove('show');$('aliasBox').classList.remove('show');$('letters').innerHTML='';$('triangle').innerHTML='';$('result').classList.remove('show');$('toast').textContent='';setWorking(false);}
  function showResult(r){$('score').innerHTML=`${String(r.score).padStart(2,'0')}<small>%</small>`;$('verdict').textContent=T.verdict(r.score);$('disclaimer').textContent=lang==='ko'?'점수는 100% 이름 획수 놀이예요. 산도, 바디, 실제 음식 궁합은 반영하지 않았습니다.':'100% name-stroke game. Acidity, body and real food pairing are not used.';$('result').classList.add('show');}
  function makeRow(values,hidden=false){const row=document.createElement('div');row.className='row show';values.forEach(v=>{const n=document.createElement('span');n.className='num';n.textContent=hidden?'':v;if(hidden)n.style.opacity='0';row.appendChild(n);});return row;}
  async function revealLetters(items,myRun){const letters=$('letters');letters.innerHTML=items.map(x=>`<span class="chip ${x.side}">${x.ch}</span>`).join('');const chips=[...letters.querySelectorAll('.chip')];if(reduceMotion()){chips.forEach(x=>x.classList.add('show'));return;}for(const chip of chips){if(myRun!==runId)return;chip.classList.add('show');await sleep(34);}}
  async function runDomino(rows,myRun){const triangle=$('triangle');triangle.innerHTML='';const first=makeRow(rows[0]);triangle.appendChild(first);if(!reduceMotion())await sleep(120);
    for(let ri=0;ri<rows.length-1;ri++){
      if(myRun!==runId)return;
      const current=triangle.children[ri],currentNums=[...current.querySelectorAll('.num')],nextValues=rows[ri+1],next=makeRow(nextValues,true);triangle.appendChild(next);const nextNums=[...next.querySelectorAll('.num')];current.classList.add('is-active');
      for(let i=0;i<nextValues.length;i++){
        if(myRun!==runId)return;
        currentNums[i].classList.add('is-current');currentNums[i+1].classList.add('is-current');
        if(!reduceMotion())await sleep(36);
        nextNums[i].textContent=nextValues[i];nextNums[i].style.opacity='1';nextNums[i].classList.add('is-born','is-flash');
        if(!reduceMotion())await sleep(24);
        currentNums[i].classList.remove('is-current');currentNums[i+1].classList.remove('is-current');
      }
      current.classList.remove('is-active');if(!reduceMotion())await sleep(72);
    }
  }
  async function renderCalc(g,f,instant=false){
    clearStage();const myRun=runId;const r=compute(g,f);$('stage').classList.add('show');setWorking(!instant);
    if(g.alias){$('aliasOld').textContent=label(g);$('aliasNew').textContent=g.alias;$('aliasBox').classList.add('show');if(!instant&&!reduceMotion())await sleep(390);}
    if(myRun!==runId)return;
    if(instant){$('letters').innerHTML=r.items.map(x=>`<span class="chip ${x.side} show">${x.ch}</span>`).join('');$('triangle').innerHTML=r.rows.map(row=>`<div class="row show">${row.map(n=>`<span class="num">${n}</span>`).join('')}</div>`).join('');showResult(r);setWorking(false);return;}
    await revealLetters(r.items,myRun);if(myRun!==runId)return;if(!reduceMotion())await sleep(110);await runDomino(r.rows,myRun);if(myRun!==runId)return;if(!reduceMotion())await sleep(150);showResult(r);setWorking(false);
  }
  function setMode(mode){const pair=mode==='pair';$('pairPanel').style.display=pair?'block':'none';$('destinyPanel').classList.toggle('show',!pair);$('pairTab').classList.toggle('active',pair);$('destinyTab').classList.toggle('active',!pair);if(!pair){clearStage();renderDestiny();}}
  function renderDestiny(){const g=grapeById($('destinyGrape').value);if(!g){$('rank').innerHTML='';$('destinyAlias').classList.remove('show');$('destinyAlias').textContent='';return;}const ranked=foods.map(f=>({f,...compute(g,f)})).sort((a,b)=>b.score-a.score).slice(0,5);$('rank').innerHTML=ranked.map((x,i)=>`<button type="button" data-food="${x.f.id}"><span class="medal">${String(i+1).padStart(2,'0')}</span><span><span class="rank-name">${label(x.f)}</span><span class="rank-sub">${T.rankSub(x.score)}</span></span><span class="rank-score">${String(x.score).padStart(2,'0')}%</span></button>`).join('');$('destinyAlias').classList.toggle('show',!!g.alias);$('destinyAlias').textContent=g.alias?T.aliasDestiny(label(g),g.alias):'';$('rank').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{$('grape').value=g.id;$('food').value=b.dataset.food;setMode('pair');renderCalc(g,foodById(b.dataset.food),false);history.replaceState(null,'',shareUrl(g.id,b.dataset.food));}));}
  function shareUrl(gid,fid){const u=new URL(location.href);u.search='';u.searchParams.set('grape',gid);u.searchParams.set('food',fid);u.searchParams.set('result','1');return u.toString();}
  async function shareCurrent(){const {g,f}=selectedPair();if(!g||!f)return;const url=shareUrl(g.id,f.id);try{if(navigator.share){await navigator.share({title:T.title,text:T.shareText,url});}else if(navigator.clipboard){await navigator.clipboard.writeText(url);$('toast').textContent=T.copied;}else{prompt(T.share,url);}}catch(e){if(e&&e.name!=='AbortError')$('toast').textContent=url;}}
  function loadParams(){const p=new URLSearchParams(location.search),gid=p.get('grape'),fid=p.get('food'),g=grapeById(gid),f=foodById(fid);if(g){$('grape').value=g.id;$('destinyGrape').value=g.id}if(f)$('food').value=f.id;updateReadyState();if(p.get('result')==='1'&&g&&f)renderCalc(g,f,true);}

  populate($('grape'),grapes,T.grapePlaceholder);populate($('destinyGrape'),grapes,T.destinyPlaceholder);populate($('food'),foods,T.foodPlaceholder);setText();updateReadyState();loadParams();
  $('runBtn').addEventListener('click',()=>{const {g,f}=selectedPair();if(!g||!f)return;renderCalc(g,f,false);history.replaceState(null,'',shareUrl(g.id,f.id));});
  $('grape').addEventListener('change',()=>{clearStage();updateReadyState();history.replaceState(null,'',location.pathname);});$('food').addEventListener('change',()=>{clearStage();updateReadyState();history.replaceState(null,'',location.pathname);});
  $('pairTab').addEventListener('click',()=>setMode('pair'));$('destinyTab').addEventListener('click',()=>setMode('destiny'));$('destinyGrape').addEventListener('change',renderDestiny);$('againBtn').addEventListener('click',()=>{clearStage();updateReadyState();history.replaceState(null,'',location.pathname);});$('shareResult').addEventListener('click',shareCurrent);$('shareTop').addEventListener('click',shareCurrent);
})();
</script>
</body>
